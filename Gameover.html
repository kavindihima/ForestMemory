 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You Won the Game!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #fff;
    }

    /* 🎬 Fullscreen background video */
    video.bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* 🏆 Center content */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px) brightness(1);
      background: rgba(0, 0, 0, 0.3);
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 3rem;
      color: #00ffc6;
      text-shadow: 0 0 15px rgba(0, 255, 198, 0.8);
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.2rem;
      color: #fff;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    /* 🎮 Play Again Button */
    .btn {
      background: linear-gradient(135deg, #00ffc6, #0096ff);
      border: none;
      border-radius: 50px;
      color: #000;
      padding: 14px 40px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 255, 198, 0.5);
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 198, 0.8);
    }
  </style>
</head>
<body>
  <!-- 🎬 Clear background video -->
  <video autoplay muted loop class="bg-video">
    <source src="images/WhatsApp Video 2025-11-10 at 7.50.20 PM.mp4" type="video/mp4">
  </video>

  <!-- 🎵 Soft victory sound -->
  <audio autoplay>
    <source src="sounds/epic-anime-rock-song-with-piano-elements-261109.mp3" type="audio/mpeg">
  </audio>

  <!-- 🏆 Center Message -->
  <div class="content">
    <h1>Congratulations!</h1>
    <p>You’ve completed all levels — you’re truly unstoppable!</p>
    <a href="index.html" class="btn">🔁 Play Again</a>
  </div>
</body>
</html>

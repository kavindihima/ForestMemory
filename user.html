<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forest Memory</title>
  <style>
    /* minimal styles (kept from your theme) */
    * { box-sizing: border-box; font-family: "Poppins", sans-serif; margin: 0; padding: 0; }
    body {
      background: url("images/Gemini_Generated_Image_mknh3cmknh3cmknh.png") center/cover fixed no-repeat;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header { display:flex; justify-content:space-between; align-items:center; padding:1rem 4%; position:fixed; width:100%; top:0; z-index:100; }
    .navbar a { margin-left:.8rem; padding:.5rem 1rem; color:#fff; border-radius:40px; border:2px solid rgba(136,204,231,.35); text-decoration:none; }
    .hero-section { display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; padding-top:100px; animation:fadeIn .9s ease; }
    .hero-section img { max-width:320px; border-radius:14px; opacity:.85; filter:drop-shadow(0 10px 25px rgba(0,0,0,.25)); transition:all .45s ease; animation:floaty 6s ease-in-out infinite; }
    .hero-section img:hover { transform:scale(1.04); opacity:1; filter:drop-shadow(0 0 30px rgba(122,94,255,.45)); }

    .btn-container { display:flex; gap:1.25rem; margin-top:1.6rem; }
    .hero-btn {
      padding:12px 30px;
      border-radius:30px;
      background: linear-gradient(90deg,#2ddce2,#07525279);
      color:#fff;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 6px 18px rgb(255, 255, 255);
      transition:transform .25s ease, box-shadow .25s ease, opacity .2s ease;
    }
    .hero-btn:hover { transform:translateY(-4px) scale(1.03); box-shadow:0 10px 28px rgba(0,0,0,.35); }
    .btn-clicked { transform: scale(.92) !important; opacity:.9; }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }

    /* small responsive */
    @media (max-width:520px) {
      .hero-section img { max-width:220px; }
      .hero-btn { padding:10px 18px; font-size:.95rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <header class="header">
 
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="index.html#Game">Play</a>
      <a href="index.html#about">About</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero-section">
    <img src="images/Gemini_Generated_Image_mknh3cmknh3cmknh.png" alt="Lune – The Lost Wanderer">
    <div class="btn-container">
      <!-- Note: IDs added so JS can attach listeners -->
      <button class="hero-btn" id="loginBtn" type="button">LOGIN</button>
      <button class="hero-btn" id="signupBtn" type="button">SIGN UP</button>
    </div>
  </section>

  <!-- audio file (make sure the path is correct relative to this HTML file) -->
 

 

<audio id="clickSound" src="sounds/mouse-click-sound-376877.mp3" preload="auto"></audio>
<audio id="bgMusic" src="sounds/creepy-halloween-bells-loop-408748.mp3" loop preload="auto"></audio>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const clickSound = document.getElementById("clickSound");
  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");

  function playClickSound() {
    // Reset and play sound
    clickSound.currentTime = 0;
    clickSound.play().catch(err => console.log("⚠️ Sound blocked:", err));
  }

  // Unlock audio context (required on some browsers)
  window.addEventListener("click", () => {
    clickSound.play().then(() => {
      clickSound.pause();
      clickSound.currentTime = 0;
    }).catch(() => {});
  }, { once: true });

  // Add button actions
  loginBtn.addEventListener("click", () => {
    playClickSound();
    loginBtn.classList.add("btn-clicked");
    setTimeout(() => (window.location.href = "login.html"), 400);
  });

  signupBtn.addEventListener("click", () => {
    playClickSound();
    signupBtn.classList.add("btn-clicked");
    setTimeout(() => (window.location.href = "signup.html"), 400);
  });
});
</script>


</body>
</html>

<!-- 🎉 FILE: congrats.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memories Reclaimed</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: "Poppins", sans-serif;
      color: #fff;
      background: #000;
    }

    video#bgVideo {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.85) contrast(1.05) saturate(1.15);
      z-index: -3;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 60%, rgba(255,215,0,0.05) 0%, rgba(0,0,0,0.85) 100%);
      z-index: -2;
    }

    .particle {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, #ffd700, rgba(255,215,0,0));
      opacity: 0;
      animation: float 12s linear infinite;
      z-index: -1;
    }

    @keyframes float {
      0% { transform: translateY(110vh) scale(0.2); opacity: 0; }
      30% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    .light-flare {
      position: absolute;
      top: 30%; left: 50%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,255,255,0.2), rgba(255,255,255,0));
      transform: translateX(-50%);
      filter: blur(60px);
      animation: pulse 6s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes pulse {
      from { opacity: 0.3; transform: translateX(-50%) scale(1); }
      to { opacity: 0.8; transform: translateX(-50%) scale(1.3); }
    }

    .content {
      position: absolute;
      bottom: 15%;
      width: 100%;
      text-align: center;
      padding: 0 15px;
    }

    h1 {
      font-size: 3rem;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #000000, #105cff, #be10f4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(60px);
      animation: fadeUp 1.8s ease forwards;
      animation-delay: 1s;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
    }

    .story-line {
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.7;
      max-width: 900px;
      margin: 0.8em auto;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 2s ease forwards;
      text-shadow: 0 0 25px rgba(255,255,255,0.2);
    }

    .story-line:nth-of-type(1) { animation-delay: 2.5s; }
    .story-line:nth-of-type(2) { animation-delay: 4s; }
    .story-line:nth-of-type(3) { animation-delay: 5.5s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .highlight {
      color: #ffd700;
      font-weight: 600;
      text-shadow: 0 0 25px rgba(255,215,0,0.7);
    }

    .btn {
      margin-top: 4em;
      padding: 16px 60px;
      font-size: 1.3rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(90deg, #4a5fff, #0800ff, #ba17ff);
      color: #111;
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: 0 0 35px rgba(255,215,0,0.4);
      transition: all 0.4s ease;
      opacity: 0;
      animation: fadeInBtn 1.5s ease forwards;
      animation-delay: 7s;
    }

    .btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 50px rgba(255,215,0,0.8);
      background: linear-gradient(90deg, #ffe066, #fff9b0, #ffb300);
    }

    @keyframes fadeInBtn { to { opacity: 1; } }

    .fade-out { animation: fadeToBlack 1.6s ease forwards; }
    @keyframes fadeToBlack { to { opacity: 0; filter: brightness(0); } }

    @media (max-width: 600px) {
      h1 { font-size: 2.8rem; }
      .story-line { font-size: 1.1rem; }
    }
  </style>
</head>

<body>
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="images/Screen Recording 2025-11-11 at 13.28.16.mov" type="video/mp4" />
  </video>

  <div class="overlay"></div>
  <div class="light-flare"></div>

  <audio id="bgMusic" autoplay loop>
    <source src="sounds/anime-rock-2-296536.mp3" type="audio/mpeg">
  </audio>

  <div class="content">
    <h1>Congratulations</h1>
    <p class="story-line">The final lock clicks open — and with it, the fog of forgotten years drifts away.</p>
    <p class="story-line">He stands once more beneath the golden sky of his <span class="highlight">hometown</span>, warmth filling the silence.</p>
    <p class="story-line">You’ve given him back what time had stolen — and now, peace is his to keep.</p>
    <button class="btn" id="continueBtn">Continue the Journey</button>
  </div>

  <script>
    // Particles
    for (let i = 0; i < 30; i++) {
      const p = document.createElement("div");
      p.classList.add("particle");
      const size = Math.random() * 4 + 2;
      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.left = `${Math.random() * 100}%`;
      p.style.animationDuration = `${8 + Math.random() * 6}s`;
      p.style.animationDelay = `${Math.random() * 8}s`;
      document.body.appendChild(p);
    }

    // Music autoplay fix
    const music = document.getElementById("bgMusic");
    window.addEventListener("load", () => {
      music.volume = 0.5;
      music.play().catch(() => {
        document.body.addEventListener("click", () => music.play(), { once: true });
      });
    });

    // Continue button
    document.getElementById("continueBtn").addEventListener("click", () => {
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = "game02.html";
      }, 1600);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="game.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forest Memory</title>
  <style>
    * { box-sizing: border-box; font-family: "Poppins", sans-serif; margin: 0; padding: 0; }
    body {
      background: url("images/Gemini_Generated_Image_i68lr5i68lr5i68l.png") center/cover fixed no-repeat;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .hero-btn, .season-btn {
      padding: 12px 30px;
      border-radius: 30px;
      background: linear-gradient(90deg, #2ddce2, #07525279);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgb(255, 255, 255);
      transition: transform .25s ease, box-shadow .25s ease, opacity .2s ease;
    }
    .hero-btn:hover, .season-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .35);
    }
    .btn-clicked { transform: scale(.9); opacity: .9; transition: transform 0.15s ease; }
  </style>
</head>
<body>

<section class="seasons-section" id="Game">

  <!-- Season 1 -->
  <div class="season-card">
    <img src="images/Gemini_Generated_Image_mknh3cmknh3cmknh.png" alt="Season 1">
    <h3>Lune – The Lost Wanderer</h3>
    <p>“I see flashes of who I was every time you find a match.”</p>
    <button class="season-btn" id="season1">Start-journey</button>
  </div>

  <!-- Season 2 -->
  <div class="season-card">
    <img src="images/Gemini_Generated_Image_i68lr5i68lr5i68l.png" alt="Season 2">
    <h3>Lune – The Lost Wanderer</h3>
    <p>“All the shadows unfold when memories are found.”</p>
    <button class="season-btn" id="season2">Start-journey</button>
  </div>

  <!-- Season 3 (Locked) -->
  <div class="season-card locked">
    <div class="lock-overlay">
      <i class="fa-solid fa-lock"></i>
    </div>
    <img src="images/Gemini_Generated_Image_tzi1aotzi1aotzi1 (1).png" alt="Season 3">
    <h3>Lune – The Lost Wanderer</h3>
    <p>“Every step brings light to what was once forgotten.”</p>
    <button class="season-btn" id="season3">Season 3</button>
  </div>

</section>

<!-- 🔊 Sounds -->
<audio id="clickSound" src="sounds/mouse-click-sound-376877.mp3" preload="auto"></audio>
<audio id="bgMusic" src="sounds/mistletoe-xmas-piano-music-218353.mp3" loop preload="auto"></audio>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const season1Btn = document.getElementById("season1");
  const season2Btn = document.getElementById("season2");
  const season3Btn = document.getElementById("season3");
  const clickSound = document.getElementById("clickSound");
  const bgMusic = document.getElementById("bgMusic");

  // 🎵 Start background music after first user interaction
  const startMusic = () => {
    bgMusic.volume = 0.25;
    bgMusic.play().catch(() => console.log("Autoplay blocked"));
    document.removeEventListener("click", startMusic);
  };
  document.addEventListener("click", startMusic);

  // 🔘 Season 1 click
  season1Btn.addEventListener("click", () => {
    clickSound.currentTime = 0;
    clickSound.play();
    season1Btn.classList.add("btn-clicked");
    setTimeout(() => { window.location.href = "Game.html"; }, 400);
  });

  // 🔘 Season 2 click
  season2Btn.addEventListener("click", () => {
    clickSound.currentTime = 0;
    clickSound.play();
    season2Btn.classList.add("btn-clicked");
    setTimeout(() => { window.location.href = "Game1.html"; }, 400);
  });

  // 🔘 Season 3 click (optional future unlock)
  season3Btn.addEventListener("click", () => {
    clickSound.currentTime = 0;
    clickSound.play();
    season3Btn.classList.add("btn-clicked");
    setTimeout(() => { window.location.href = "Game2.html"; }, 400);
  });
});
</script>

</body>
</html>

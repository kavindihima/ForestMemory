<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Season 2 Unlocked!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
      background: #000;
    }

    /* 🎥 Background Video */
    video#bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: none; /* keep background clear */
    }

    /* 🔊 Background Sound (hidden) */
    audio#unlockSound {
      display: none;
    }

    /* 💎 Main Container */
    .container {
      padding: 50px 90px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.145);
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
    }

    .container:hover {
      transform: scale(1.02);
      box-shadow: 0 0 80px rgba(255, 255, 255, 0.25);
    }

    /* ✨ Gorgeous Heading */
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5em;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 800;
      background: linear-gradient(90deg, #ffcc33, #fff4b0, #ffcc33);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
    }

    /* Shine sweep */
     
      
    @keyframes shine {
      0% { left: -100%; }
      100% { left: 120%; }
    }

    /* Subtext */
    p {
      font-size: 1.5rem;
      margin-top: 0.4em;
      color: #f5f5f5;
    }

    .highlight {
      color: #ffd700;
      font-weight: 700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }

    /* 🎮 Continue Button */
    .btn {
      margin-top: 1.5em;
      padding: 14px 40px;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(90deg, #ffb3002d, #ffd700);
      color: #111;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    }

    /* Fade In Animation */
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 600px) {
      h1 { font-size: 2.8rem; }
      p { font-size: 1.2rem; }
      .container { padding: 30px 40px; }
    }
  </style>
</head>
<body>

  <!-- 🎥 Background Video -->
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="images/Screen Recording 2025-11-11 at 12.27.17.mov" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <!-- 🔊 Unlock Sound -->
   <!-- 🎵 Background Music -->
<audio id="bgMusic" autoplay loop>
  <source src="sounds/anime-rock-2-296536.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>


  <!-- 🌟 Content -->
  <div class="container">
    <h1>Congratulations</h1>
    <p>You’ve unlocked <span class="highlight">some memories</span>!</p>
    <button class="btn" id="continueBtn">Continue</button>
  </div>

  <script>
    // 🔊 Play sound when the page loads
    window.addEventListener("load", () => {
      const sound = document.getElementById("unlockSound");
      sound.volume = 0.7;
      sound.play().catch(() => {
        // Safari/Chrome may block autoplay sound, wait for user click
        document.body.addEventListener("click", () => {
          sound.play();
        }, { once: true });
      });
    });

    // 🎮 Continue button action
    document.getElementById("continueBtn").addEventListener("click", () => {
      // Example: Navigate to next level or game page
      window.location.href = "game01.html"; 
    });
  </script>
  <script>
document.addEventListener("click", () => {
  const bgMusic = document.getElementById("bgMusic");
  bgMusic.play().catch(err => console.log("Autoplay blocked:", err));
}, { once: true });
</script>


</body>
</html>
